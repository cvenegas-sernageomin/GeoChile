<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#1a5276"/>
<title>Geo Repo Maule — SERNAGEOMIN</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  html,body{margin:0;height:100%;font-family:'Segoe UI',Arial,sans-serif;
            -webkit-text-size-adjust:100%}
  /* Panel ABAJO: mapa arriba ocupando todo, panel acoplado al pie */
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  #map{flex:1;min-height:0}
  #panel{flex:none;display:flex;flex-direction:column;background:#f4f7fa;
         border-top:2px solid #1a5276;box-shadow:0 -3px 10px rgba(0,0,0,.13);
         max-height:46vh;max-height:46dvh;z-index:1100}
  #panel h1{font-size:14px;color:#1a5276;margin:0;line-height:1.2;font-weight:700}

  /* Barra del panel: siempre visible, toda clickeable para plegar/desplegar */
  #phead{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px;
         background:#fff;border-bottom:1px solid #dbe4ec;cursor:pointer;user-select:none;
         min-height:48px}
  #phead:hover{background:#f7fafc}
  #plogo{width:36px;height:36px;object-fit:contain;border-radius:6px;flex:none;
         background:#fff;border:1px solid #d5dee7}
  #ptoggle{margin-left:auto;flex:none;min-width:52px;height:36px;line-height:1;cursor:pointer;
           border:1px solid #b7c6d4;background:#eef4f9;border-radius:8px;color:#1a5276;
           font-size:19px;font-weight:700;padding:0;display:flex;align-items:center;
           justify-content:center}
  #ptoggle:hover{background:#dbe8f3}
  #ptoggle:active{background:#c9dced}

  /* Cuerpo desplazable; al contraer solo queda la barra */
  #pbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 14px;
         padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  #panel.collapsed #pbody{display:none}

  /* Bloque de grilla IGM */
  #grilla{background:#fff;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px;
          padding:9px 10px}
  #grilla label{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;
                font-weight:600;color:#1a5276}
  #grilla select{width:100%;margin-top:8px;font-size:15px;padding:8px;border-radius:8px;
                 border:1px solid #cbd5e1;background:#fff}
  .grid-lbl{background:rgba(255,255,255,.82);border:1px solid #b06a1f;color:#8a4b12;
            font-size:11px;font-weight:700;padding:0 3px;border-radius:3px;box-shadow:none}
  .grid-lbl::before{display:none}
  details{background:#fff;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px;
          break-inside:avoid}
  summary{cursor:pointer;padding:11px 10px;font-weight:600;color:#1a5276;font-size:14px}
  .capa{padding:9px 10px;border-top:1px solid #eef2f6}
  .capa label{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer;
              line-height:1.3}
  .capa input[type=checkbox],#grilla input[type=checkbox]{width:19px;height:19px;flex:none;
              accent-color:#1a5276;margin:0}
  .capa .ctl{display:none;margin-top:8px;gap:8px;align-items:center;flex-wrap:wrap}
  .capa.on .ctl{display:flex}
  .capa input[type=range]{flex:1;min-width:110px;height:24px;accent-color:#1a5276}
  .capa button{font-size:13px;border:1px solid #cbd5e1;background:#fff;border-radius:8px;
               padding:7px 11px;cursor:pointer;white-space:nowrap}
  .capa .pdf{font-size:13px;border:1px solid #e0a878;background:#fff5ec;color:#a2531a;
             border-radius:8px;padding:7px 11px;cursor:pointer;text-decoration:none;
             white-space:nowrap;flex:none}
  .capa .pdf:hover{background:#fde8d4}

  /* PC ancho: el panel de abajo reparte las categorias en columnas */
  @media (min-width:900px){
    #panel{max-height:40vh}
    #pbody{columns:3;column-gap:12px}
    #grilla{column-span:all}
  }
  @media (min-width:1400px){ #pbody{columns:4} }

  /* Telefono: panel mas alto y tipografia comoda */
  @media (max-width:640px){
    #panel{max-height:52vh;max-height:52dvh}
    #panel h1{font-size:13px}
    #plogo{width:32px;height:32px}
    .leaflet-control-layers,.leaflet-control-zoom{font-size:15px}
  }
  #legmodal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;
            align-items:center;justify-content:center;z-index:2000}
  #legmodal.open{display:flex}
  #legwrap{background:#fff;border-radius:8px;max-width:92vw;max-height:92vh;overflow:hidden;
           position:relative}
  #legwrap img{display:block;transform-origin:0 0;touch-action:none;user-select:none;max-width:none}
  #legclose{position:absolute;top:8px;right:10px;z-index:5;background:#fff;border:1px solid #cbd5e1;
            border-radius:8px;padding:9px 14px;cursor:pointer;font-size:14px;
            box-shadow:0 1px 4px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="panel">
    <div id="phead" role="button" tabindex="0" aria-expanded="true" aria-controls="pbody"
         title="Mostrar u ocultar el panel">
      <img id="plogo" src="assets/banner_sernageomin.jpg" alt="SERNAGEOMIN"/>
      <h1>Geología · Región del Maule</h1>
      <button id="ptoggle" aria-label="Ocultar panel" title="Ocultar panel">&#9660;</button>
    </div>
    <div id="pbody">
      <div id="grilla">
        <label><input type="checkbox" id="grilla-chk"/> 🔲 Grilla IGM 1:100.000</label>
        <select id="grilla-sel" aria-label="Ir a carta">
          <option value="">Ir a una carta…</option>
        </select>
      </div>
      <div id="capas"></div>
    </div>
  </div>
</div>
<div id="legmodal"><div id="legwrap"><button id="legclose">✕ Cerrar</button><img id="legimg"/></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CATS = [["geologia","🗺️ Geología"],["aplicada","⚠️ Aplicada"],
  ["historico","📜 Histórico"],["academico","🎓 Académicos"],["hillshade","🏔️ Hillshade"]];
const map = L.map('map',{center:[-35.7,-71.6],zoom:8});
const bases = {
  "Satelital": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'}),
  "Topográfico": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'}),
  "OpenTopoMap": L.tileLayer('https://a.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'OpenTopoMap'})
};
bases["Satelital"].addTo(map);
L.control.layers(bases,null,{position:'topright'}).addTo(map);
CATS.forEach(([c],i)=>map.createPane('pane_'+c).style.zIndex = 300 + i*10);
map.createPane('pane_grilla').style.zIndex = 400;   // grilla sobre los overlays

const overlays = {}; // id -> L.imageOverlay

/* ---- Grilla de cartas IGM 1:100.000 (F07-F29) ----
   Coordenadas extraidas del maule_indice.kmz publicado (grilla regular 0.5°). */
const GRID_IGM = [
  {c:"F07",n:-34.5,s:-35.0,e:-72.0,w:-72.5}, {c:"F08",n:-34.5,s:-35.0,e:-71.5,w:-72.0},
  {c:"F09",n:-34.5,s:-35.0,e:-71.0,w:-71.5}, {c:"F10",n:-34.5,s:-35.0,e:-70.5,w:-71.0},
  {c:"F11",n:-34.5,s:-35.0,e:-70.0,w:-70.5}, {c:"F12",n:-35.0,s:-35.5,e:-72.5,w:-73.0},
  {c:"F13",n:-35.0,s:-35.5,e:-72.0,w:-72.5}, {c:"F14",n:-35.0,s:-35.5,e:-71.5,w:-72.0},
  {c:"F15",n:-35.0,s:-35.5,e:-71.0,w:-71.5}, {c:"F16",n:-35.0,s:-35.5,e:-70.5,w:-71.0},
  {c:"F17",n:-35.0,s:-35.5,e:-70.0,w:-70.5}, {c:"F18",n:-35.5,s:-36.0,e:-72.5,w:-73.0},
  {c:"F19",n:-35.5,s:-36.0,e:-72.0,w:-72.5}, {c:"F20",n:-35.5,s:-36.0,e:-71.5,w:-72.0},
  {c:"F21",n:-35.5,s:-36.0,e:-71.0,w:-71.5}, {c:"F22",n:-35.5,s:-36.0,e:-70.5,w:-71.0},
  {c:"F23",n:-35.5,s:-36.0,e:-70.0,w:-70.5}, {c:"F24",n:-36.0,s:-36.5,e:-72.5,w:-73.0},
  {c:"F25",n:-36.0,s:-36.5,e:-72.0,w:-72.5}, {c:"F26",n:-36.0,s:-36.5,e:-71.5,w:-72.0},
  {c:"F27",n:-36.0,s:-36.5,e:-71.0,w:-71.5}, {c:"F28",n:-36.0,s:-36.5,e:-70.5,w:-71.0},
  {c:"F29",n:-36.0,s:-36.5,e:-70.0,w:-70.5}
];
const ESTILO_GRID = {color:'#b06a1f',weight:1.5,fillColor:'#ffffff',fillOpacity:.05};
const ESTILO_GRID_HL = {color:'#d84315',weight:3,fillColor:'#ff7043',fillOpacity:.25};

const gridLayer = L.layerGroup([], {pane:'pane_grilla'});
const gridRects = {};   // codigo -> L.rectangle
GRID_IGM.forEach(g=>{
  const r = L.rectangle([[g.s,g.w],[g.n,g.e]], Object.assign({pane:'pane_grilla'}, ESTILO_GRID));
  r.bindTooltip(g.c, {permanent:true, direction:'center', className:'grid-lbl'});
  r.on('click', ()=>irACarta(g.c));
  gridRects[g.c] = r;
  gridLayer.addLayer(r);
});

const gridChk = document.getElementById('grilla-chk');
const gridSel = document.getElementById('grilla-sel');
GRID_IGM.forEach(g=>{
  const o=document.createElement('option'); o.value=g.c; o.textContent='Carta '+g.c;
  gridSel.appendChild(o);
});

gridChk.addEventListener('change',()=>{
  if(gridChk.checked) gridLayer.addTo(map); else gridLayer.remove();
});

let hlTimer = null;
function irACarta(cod){
  const g = GRID_IGM.find(x=>x.c===cod);
  if(!g) return;
  if(!gridChk.checked){ gridChk.checked = true; gridLayer.addTo(map); }
  map.fitBounds([[g.s,g.w],[g.n,g.e]]);
  const r = gridRects[cod];
  if(!r) return;
  clearTimeout(hlTimer);
  Object.values(gridRects).forEach(x=>x.setStyle(ESTILO_GRID));
  r.setStyle(ESTILO_GRID_HL);
  hlTimer = setTimeout(()=>r.setStyle(ESTILO_GRID), 1800);
}
gridSel.addEventListener('change',()=>{ if(gridSel.value) irACarta(gridSel.value); });

/* ---- Panel inferior plegable (toda la barra es el control) ---- */
const panel = document.getElementById('panel');
const phead = document.getElementById('phead');
const ptoggle = document.getElementById('ptoggle');
function togglePanel(){
  const col = panel.classList.toggle('collapsed');
  ptoggle.innerHTML = col ? '&#9650;' : '&#9660;';      // ▲ desplegar / ▼ ocultar
  ptoggle.title = ptoggle.ariaLabel = col ? 'Mostrar panel' : 'Ocultar panel';
  phead.setAttribute('aria-expanded', String(!col));
  setTimeout(()=>map.invalidateSize(), 220);
}
phead.addEventListener('click', togglePanel);
phead.addEventListener('keydown', e=>{
  if(e.key==='Enter' || e.key===' '){ e.preventDefault(); togglePanel(); }
});
// el boton vive dentro de la barra: evita contar el click dos veces
ptoggle.addEventListener('click', e=>e.stopPropagation());
ptoggle.addEventListener('click', togglePanel);

// En telefono conviene partir con el mapa a la vista
if(window.matchMedia('(max-width:640px)').matches) togglePanel();

// El panel cambia de alto al llenarse y al rotar el telefono: Leaflet debe re-medirse,
// si no queda con un tamano interno viejo y las capas se dibujan corridas.
let rzT=null;
const remedir=()=>{ clearTimeout(rzT); rzT=setTimeout(()=>map.invalidateSize(),150); };
window.addEventListener('resize',remedir);
window.addEventListener('orientationchange',()=>setTimeout(()=>map.invalidateSize(),300));
// En movil la barra del navegador aparece/desaparece cambiando el alto SIN emitir 'resize':
// observar el contenedor cubre esos casos.
if(window.ResizeObserver) new ResizeObserver(remedir).observe(document.getElementById('map'));

function crearCapa(cont, c){
  const b=c.bounds;
  if (!b || !['n','s','e','w'].every(k => typeof b[k] === 'number')) {
    console.warn('capa con bounds invalidos, omitida:', c.id);
    return;
  }
  const bounds=[[b.s,b.w],[b.n,b.e]];
  const div=document.createElement('div'); div.className='capa';
  const label=document.createElement('label');
  const chk=document.createElement('input'); chk.type='checkbox';
  label.appendChild(chk);
  label.appendChild(document.createTextNode(' ' + c.titulo));
  div.appendChild(label);
  const ctl=document.createElement('div'); ctl.className='ctl';
  ctl.innerHTML = `<input type="range" min="0" max="1" step="0.05" value="${c.opacidad ?? 1}">
       ${c.leyenda?'<button class="leg">ⓘ Leyenda</button>':''}`;
  // Informe PDF (servido desde el repo KMZ): enlace construido por DOM, sin innerHTML.
  if(c.pdf && /^https:\/\//.test(c.pdf)){
    const a=document.createElement('a');
    a.className='pdf'; a.href=c.pdf; a.target='_blank'; a.rel='noopener noreferrer';
    a.textContent='⬇ PDF';
    a.title='Abrir informe'+(c.informe?' '+c.informe:'')+' (PDF)';
    ctl.appendChild(a);
  }
  div.appendChild(ctl);
  const rng=ctl.querySelector('input[type=range]');
  chk.addEventListener('change',()=>{
    if(chk.checked){
      if(!overlays[c.id]) overlays[c.id]=L.imageOverlay(c.overlay,bounds,
        {opacity:+rng.value,pane:'pane_'+c.categoria});
      overlays[c.id].addTo(map); div.classList.add('on');
    }else if(overlays[c.id]){ overlays[c.id].remove(); div.classList.remove('on'); }
  });
  rng.addEventListener('input',()=>{ if(overlays[c.id]) overlays[c.id].setOpacity(+rng.value); });
  const legBtn=ctl.querySelector('.leg');
  if(legBtn) legBtn.addEventListener('click',()=>abrirLeyenda(c.leyenda));
  cont.appendChild(div);
}

// cache:'no-cache' revalida siempre contra el servidor (304 si no cambio): sin esto el
// navegador sirve un capas.json viejo de su cache y el visor no ve las capas nuevas.
fetch('capas.json',{cache:'no-cache'}).then(r=>r.json()).then(capas=>{
  const cont=document.getElementById('capas');
  CATS.forEach(([cat,label])=>{
    const grupo=capas.filter(c=>c.categoria===cat);
    if(!grupo.length) return;
    const d=document.createElement('details');
    d.innerHTML=`<summary>${label} (${grupo.length})</summary>`;
    grupo.forEach(c=>crearCapa(d,c));
    cont.appendChild(d);
  });
  map.invalidateSize();   // el panel ya tiene su alto final: re-medir el mapa
}).catch(e=>console.error('No se pudo cargar capas.json:', e));
</script>
<script src="viewer_legend.js"></script>
</body>
</html>
